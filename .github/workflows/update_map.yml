name: Actualisation de la Carte

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
       run: |
         python -m pip install --upgrade pip
         pip install folium requests markdown

      - name: Générer la carte HTML
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python generate_map_public.py

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Televerser l'artefact HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
