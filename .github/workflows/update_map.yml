name: Actualisation de la Carte

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install folium requests markdown pandas jinja2

      - name: Générer la carte HTML et télécharger les images
        env:
          PYTHONIOENCODING: utf-8
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python generate_map_public.py

      - name: Sauvegarder les images et données sur le dépôt (Git Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A assets/images/ '*.html'
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update map & downloaded images"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
