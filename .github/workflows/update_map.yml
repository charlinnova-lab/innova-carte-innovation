name: Actualisation de la Carte

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write    # Modifié : nécessaire pour autoriser le git push des images
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install folium requests markdown pandas jinja2

      - name: Générer la carte HTML et télécharger les images
        env:
          PYTHONIOENCODING: utf-8
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python generate_map_public.py

      - name: Sauvegarder les images et données sur le dépôt (Git Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/images/ *.html
          git diff --staged --quiet || git commit -m "Auto-update map & downloaded images"
          git push

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
